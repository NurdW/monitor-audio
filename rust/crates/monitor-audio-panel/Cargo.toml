[package]
name = "monitor-audio-panel"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "monitor-audio-panel"
path = "src/main.rs"

[dependencies]
monitor-audio-core = { path = "../monitor-audio-core" }
serde = "1"
serde_json = "1"
eframe = "0.31"

[dev-dependencies]
# Test scratch space that deletes itself, so a failing test cannot leave files
# behind in /tmp.
tempfile = "3"
